<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF4EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Матешка">
<meta name="description" content="Bitácora de ruso: biblioteca, casos, pares de verbos, repaso y juegos diarios.">
<title>Матешка</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@400;500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap">
<script>
/* El tema se pone antes de pintar, para que no parpadee. */
(function(){var t=null;try{t=localStorage.getItem("mateshka-theme")}catch(e){}
 if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
 document.documentElement.setAttribute("data-theme",t);
 var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#1A1317":"#FFF4EC"})();
</script>
<link rel="stylesheet" href="css/app.css?v=11">
</head>
<body>
<div class="app" id="app">
  <header class="hdr gut" id="hdr"><div class="hdr-in">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="43" rx="19" ry="18" fill="var(--acc)" stroke="var(--bc)" stroke-width="2.5"/><circle cx="32" cy="22" r="14" fill="var(--acc)" stroke="var(--bc)" stroke-width="2.5"/><circle cx="32" cy="23" r="8.5" fill="var(--face)"/><circle cx="29" cy="23" r="1.3" fill="#2A1A1F"/><circle cx="35" cy="23" r="1.3" fill="#2A1A1F"/><circle cx="27.4" cy="26" r="1.7" fill="var(--cheek)"/><circle cx="36.6" cy="26" r="1.7" fill="var(--cheek)"/><ellipse cx="32" cy="45.5" rx="11.5" ry="12" fill="var(--face)"/><path d="M25.5 40.5h13l-1.4 9.5q-5.1 3.8-10.2 0z" fill="var(--mint)" stroke="#2A1A1F" stroke-width="1.6"/><path d="M35 41.5l5-9" stroke="#B8BCC4" stroke-width="2.2" stroke-linecap="round"/></svg>
    <div class="tt"><h1 id="hTitle">МАТЕШКА</h1><div class="sub" id="hSub">Tu ruso de todos los días</div></div>
    <button class="ibtn" id="trBtn" data-act="tr" aria-label="Traducir"><svg viewBox="0 0 24 24" aria-hidden="true"><text x="1.5" y="11.5" font-family="Golos Text,Onest,sans-serif" font-size="11.5" font-weight="800" fill="currentColor">Я</text><text x="12.5" y="21.5" font-family="Onest,sans-serif" font-size="11.5" font-weight="800" fill="currentColor">A</text><path d="M14 4.5h5.5V10M19.5 4.5l-5 5" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ibtn" id="themeBtn" data-act="theme" aria-label="Cambiar a modo oscuro"><svg class="theme-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" id="themeIc"></svg></button>
  </div></header>
  <main class="gut" id="main"></main>
</div>
<nav class="dock" id="dock" aria-label="Secciones">
  <button class="tab" data-tab="home" style="--c:var(--pink)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg><small>Inicio</small></button>
  <button class="tab" data-tab="lib" style="--c:var(--butter)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 4.5h4.5v15H4zM10.5 4.5H15v15h-4.5z"/><path d="M16.5 5.5l3.5 1-3.2 13.5-3.4-.9"/></svg><small>Biblioteca</small></button>
  <button class="davai" id="davai" data-act="davai" aria-label="¡Davaicito! Ir al próximo juego del día"><span class="disc"><svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="27" rx="11" ry="10.5" fill="var(--face)" stroke="#2A1A1F" stroke-width="2"/><circle cx="20" cy="14.5" r="8.5" fill="var(--face)" stroke="#2A1A1F" stroke-width="2"/><path d="M12.2 13.5q7.8-9 15.6 0" fill="none" stroke="#2A1A1F" stroke-width="2"/><circle cx="17.4" cy="15.5" r="1.2" fill="#2A1A1F"/><circle cx="22.6" cy="15.5" r="1.2" fill="#2A1A1F"/><circle cx="15.6" cy="18" r="1.4" fill="var(--cheek)"/><circle cx="24.4" cy="18" r="1.4" fill="var(--cheek)"/><path d="M16 26.5q4 3.4 8 0" fill="none" stroke="#2A1A1F" stroke-width="1.8" stroke-linecap="round"/></svg></span><small>¡Davaicito!</small></button>
  <button class="tab" data-tab="review" style="--c:var(--mint)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="7" width="12.5" height="13" rx="2.5"/><path d="M8 3.5h10a2.5 2.5 0 0 1 2.5 2.5v10"/></svg><small>Repaso</small></button>
  <button class="tab" data-tab="ref" style="--c:var(--lilac)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="4" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M10 9.5V20"/></svg><small>Consulta</small></button>
</nav>
<div id="ov"></div>
<input type="file" id="fileFicha" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
<label class="sr" id="hapt" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script src="js/festejos.js?v=11"></script>
<script src="js/app.js?v=11"></script>
<script src="js/consulta.js?v=11"></script>
<script src="js/repaso.js?v=11"></script>
<script src="js/jugar.js?v=11"></script>
<script src="js/ia.js?v=11"></script>
<script src="js/traductor.js?v=11"></script>
<script src="js/principal.js?v=11"></script>
