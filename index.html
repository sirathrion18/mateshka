<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECE5D5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Матешка">
<meta name="description" content="Bitácora de ruso: biblioteca, casos, repaso y reto diario.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px/1.4 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
html{height:100%}
</style>
</head>
<body>
<title>Матешка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Oswald:wght@500;600&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500&display=swap">
<style>
/* Layout: one-screen app — header strip with red constructivist wedge, scrolling column, bottom tab bar with red circle for "Corregir". */
:root{
  --paper:#ECE5D5; --paper-2:#E0D6C1; --card:#F5F0E5; --ink:#17140F; --mute:#5D564A; --line:rgba(23,20,15,.18);
  --red:#C3161C; --on-red:#FFF6EE; --ok:#2C6838; --acc:#9E5F06; --ahead:#2A4A7C;
  --ok-soft:rgba(44,104,56,.12); --red-soft:rgba(195,22,28,.10); --photo:#F4F0E4; --pen:#203F88; --ruled:#A9BEDD; --photo-ink:#1E1B16;
  --f-display:"Rubik Mono One","Arial Black",Impact,sans-serif;
  --f-head:"Oswald","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"PT Sans","Helvetica Neue",Arial,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141210; --paper-2:#211E1A; --card:#1C1916; --ink:#ECE4D3; --mute:#A59C8B; --line:rgba(236,228,211,.16);
  --red:#E0353B; --ok:#73C083; --acc:#E3A548; --ahead:#8FB0E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141210; --paper-2:#211E1A; --card:#1C1916; --ink:#ECE4D3; --mute:#A59C8B; --line:rgba(236,228,211,.16);
  --red:#E0353B; --ok:#73C083; --acc:#E3A548; --ahead:#8FB0E6; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.hdr{position:relative;overflow:hidden;border-bottom:3px solid var(--ink);padding-block:14px 12px;background:var(--paper)}
.hdr::after{content:"";position:absolute;right:0;top:0;width:150px;height:100%;background:var(--red);clip-path:polygon(38% 0,100% 0,100% 100%,0 100%)}
.hdr-in{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hdr h1{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;margin:0;letter-spacing:.01em}
.hdr .sub{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.1em;font-size:12.5px;color:var(--mute);margin-top:6px}
.proto{font-family:var(--f-head);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-red);text-align:right;line-height:1.2;padding-bottom:2px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:18px 28px}
.view{display:flex;flex-direction:column;gap:26px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-t{font-family:var(--f-head);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:14px;margin:0;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:10px;height:10px;background:var(--red);flex:none}
.sec-t .ru{font-family:var(--f-body);text-transform:none;letter-spacing:0;color:var(--mute);font-weight:400;font-size:13px}
.note{font-size:13.5px;color:var(--mute);margin:0}
.ru{font-family:var(--f-body)}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:3px solid var(--ink);background:var(--paper);padding-block:6px 6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-family:var(--f-head);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg .fillable{fill:var(--red)}
.tab-main{position:relative}
.tab-main .disc{width:58px;height:58px;border-radius:50%;background:var(--red);color:var(--on-red);display:grid;place-items:center;margin-top:-26px;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.tab-main .disc svg{width:26px;height:26px}
.tab-main{color:var(--ink)}
.tab-main .dv{font-size:10.5px;letter-spacing:.02em;white-space:nowrap;color:var(--red);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-head);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:14px;border:2px solid var(--ink);background:transparent;padding:10px 14px;cursor:pointer;border-radius:0;min-height:44px;text-align:center}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1.5px solid var(--line);padding:3px 9px;background:var(--card)}
.chip.lesson{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:12px;border-color:var(--ink)}
/* progress */
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.sq{aspect-ratio:1;max-width:100%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-head);font-size:12px;font-variant-numeric:tabular-nums;background:transparent;cursor:pointer;padding:0}
.sq.done{background:var(--red);border-color:var(--red);color:var(--on-red)}
.sq.now{background:var(--ink);color:var(--paper)}
.sq.lock{border-color:var(--line);color:var(--mute)}
.big-stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big-stat .n{font-family:var(--f-display);font-size:40px;line-height:1}
.big-stat .t{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
/* fichas strip */
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.ficha{flex:0 0 78%;max-width:320px;scroll-snap-align:start;border:2px solid var(--ink);background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative}
.ficha::before{content:"";position:absolute;left:-2px;top:-2px;width:0;height:0;border-top:22px solid var(--red);border-right:22px solid transparent}
.ficha h3{margin:0;font-family:var(--f-head);font-size:16px;letter-spacing:.02em}
.ficha p{margin:0;font-size:14px}
.ficha img{max-height:120px;object-fit:cover;width:100%}
/* entries */
.entries{display:flex;flex-direction:column}
.entry{border-top:2px solid var(--ink);padding-block:14px;display:grid;grid-template-columns:62px 1fr;gap:12px}
.entry:last-child{border-bottom:2px solid var(--ink)}
.date{font-family:var(--f-head);text-transform:uppercase;line-height:1.05}
.date .d{font-family:var(--f-display);font-size:26px;display:block}
.date .m{font-size:12px;letter-spacing:.08em;color:var(--mute)}
.entry h3{margin:0 0 4px;font-size:17px}
.entry .body{min-width:0;display:flex;flex-direction:column;gap:8px}
.entry p{margin:0}
.corr-chip{display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;border:1.5px solid var(--ink);background:var(--card);padding:8px 10px;cursor:pointer;text-align:left}
.corr-chip .st{font-family:var(--f-head);font-size:12px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
/* lessons list */
.part-t{font-family:var(--f-display);font-size:14px;letter-spacing:.02em;margin:6px 0 0}
.les{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;border-top:1.5px solid var(--line);padding-block:10px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;cursor:pointer}
.les .num{font-family:var(--f-display);font-size:24px;line-height:1}
.les.done .num{color:var(--red)}
.les.lock{color:var(--mute)}
.les .t{min-width:0}
.les .t b{display:block;font-size:15px}
.les .t span{font-size:13px;color:var(--mute)}
.tag{font-family:var(--f-head);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border:1.5px solid currentColor;white-space:nowrap}
.tag.done{color:var(--ok)}
.tag.now{color:var(--red)}
.tag.lock{color:var(--mute)}
/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-in{max-width:640px;width:100%;margin:0 auto;height:100%;display:flex;flex-direction:column;min-height:0}
.ov-bar{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--ink);padding-block:10px;background:var(--paper)}
.ov-bar h2{margin:0;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:16px;flex:1;min-width:0}
.back{background:none;border:2px solid var(--ink);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.ov-body{flex:1;overflow-y:auto;padding-block:18px 32px;display:flex;flex-direction:column;gap:22px}
.steps{display:flex;gap:4px}
.steps span{flex:1;height:5px;background:var(--line)}
.steps span.on{background:var(--red)}
/* sample cards */
.samples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sample{border:2px solid var(--ink);background:var(--card);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.sample .mini{background:var(--photo);color:var(--pen);font-family:var(--f-hand);font-size:17px;line-height:1.1;padding:8px;height:92px;overflow:hidden;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 18px,var(--ruled) 18px,var(--ruled) 19px);transform:rotate(-1deg)}
.sample b{font-size:14px}
.sample span{font-size:12.5px;color:var(--mute)}
.sample.off{opacity:.55;cursor:not-allowed}
.upload{border:2px dashed var(--ink);padding:16px;display:flex;gap:14px;align-items:center;cursor:pointer;background:transparent;width:100%;text-align:left}
.upload svg{width:34px;height:34px;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* photo of exercise */
.photo{background:var(--photo);color:var(--pen);font-family:var(--f-hand);font-size:23px;line-height:32px;padding:14px 18px 16px 44px;position:relative;transform:rotate(-.6deg);box-shadow:5px 5px 0 var(--ink);background-image:linear-gradient(to right,transparent 32px,rgba(195,22,28,.45) 32px,rgba(195,22,28,.45) 33px,transparent 33px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--ruled) 31px,var(--ruled) 32px)}
.photo .ph-t{color:var(--photo-ink);font-size:19px}
.photo-img{max-width:100%;border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.banner{border:2px solid var(--ahead);color:var(--ahead);padding:10px 12px;font-size:14px;background:var(--card)}
.banner b{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
/* transcription */
.tr-list{display:flex;flex-direction:column;gap:10px}
.tr{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.tr .n{font-family:var(--f-display);font-size:16px;padding-top:9px}
.tr .p{font-size:13px;color:var(--mute);margin-bottom:4px}
.tr input,.tr textarea,.field input,.field textarea,.field select{width:100%;border:2px solid var(--ink);background:var(--card);padding:9px 10px;border-radius:0;font-size:17px}
.tr textarea{min-height:64px;resize:vertical}
.unsure{border:2px solid var(--acc);background:var(--card);padding:10px;display:flex;flex-direction:column;gap:8px}
.unsure p{margin:0;font-size:14px}
.unsure .q{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.05em;color:var(--acc);font-size:13px}
/* results */
.verif{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ok);padding:10px 12px;font-size:13.5px;color:var(--ok);background:var(--card)}
.verif svg{flex:none;width:20px;height:20px;margin-top:1px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);border:2px solid var(--ink)}
.tally div{padding:8px 6px;text-align:center;border-right:2px solid var(--ink)}
.tally div:last-child{border-right:0}
.tally b{display:block;font-family:var(--f-display);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.tally span{font-family:var(--f-head);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.items{display:flex;flex-direction:column;gap:12px}
.item{border:2px solid var(--ink);background:var(--card);border-left-width:8px}
.item.st-ok{border-left-color:var(--ok)}
.item.st-err{border-left-color:var(--red)}
.item.st-acc{border-left-color:var(--acc)}
.item.st-ahead{border-left-color:var(--ahead);border-left-style:double}
.item.st-unk{border-left-color:var(--mute)}
.item-head{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:10px 12px;align-items:start}
.item-head .num{font-family:var(--f-display);font-size:16px;padding-top:2px}
.item-head .pr{font-size:13px;color:var(--mute);margin:0}
.item-head .an{font-size:18px;margin:2px 0 0;overflow-wrap:anywhere}
.badge{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:12px;padding:3px 7px;white-space:nowrap;border:1.5px solid currentColor}
.st-ok .badge{color:var(--ok)} .st-err .badge{color:var(--red)} .st-acc .badge{color:var(--acc)} .st-ahead .badge{color:var(--ahead)} .st-unk .badge{color:var(--mute)}
.item-act{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px 46px}
.layer{margin:0 12px 12px 46px;border-top:1.5px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.layer p{margin:0}
.layer-tag{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--red)}
.layer.ahead .layer-tag{color:var(--ahead)}
.layer ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.layer ol ol{margin-top:4px;gap:2px}
.where{font-family:var(--f-head);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.fixed{font-size:19px;font-weight:700}
.alt{border:1.5px dashed var(--ink);padding:8px 10px;font-size:14.5px}
.alt b{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600}
.sticky-act{position:sticky;bottom:0;background:var(--paper);padding-block:12px;border-top:2px solid var(--ink);display:flex;gap:10px;flex-wrap:wrap}
.sticky-act .btn{flex:1 1 140px}
/* review */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:2px solid var(--ink);background:transparent;padding:6px 12px;font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.card{border:3px solid var(--ink);min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:22px;text-align:center;background:var(--card);cursor:pointer;position:relative;width:100%}
.card .src{position:absolute;top:10px;left:12px;font-family:var(--f-head);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card .front{font-size:30px;font-weight:700;line-height:1.2}
.card.memo .front{font-size:20px}
.card .backside{font-size:19px;border-top:2px solid var(--red);padding-top:10px}
.card .tap{font-size:12.5px;color:var(--mute)}
.card img{max-height:150px;max-width:100%}
.counter{font-family:var(--f-head);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.flist{display:flex;flex-direction:column}
.fl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1.5px solid var(--line);padding-block:10px}
.fl b{display:block}
.fl span{font-size:13px;color:var(--mute)}
/* errors */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:flex;flex-direction:column;gap:5px}
.bar-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bar-top b{font-size:15px}
.bar-top .c{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:14px;background:var(--paper-2);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red)}
.bar.ahead i{background:var(--ahead)}
.bar-meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);align-items:center}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.06em;font-size:12.5px}
.field textarea{min-height:90px;resize:vertical;font-size:16px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.checks input{width:20px;height:20px;accent-color:var(--red);flex:none;margin-top:2px}
/* lesson detail */
.les-hero{display:flex;align-items:flex-end;gap:14px;border-bottom:3px solid var(--ink);padding-bottom:14px}
.les-hero .n{font-family:var(--f-display);font-size:64px;line-height:.85;color:var(--red)}
.les-hero .w{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em}
ul.plain{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.plain li{padding-left:18px;position:relative}
ul.plain li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;background:var(--ink)}
.lockbox{border:2px dashed var(--mute);padding:16px;color:var(--mute);display:flex;gap:12px;align-items:flex-start}
.lockbox svg{flex:none;width:26px;height:26px}
/* chat */
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.msg p{margin:0}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--paper)}
.msg.ai{align-self:flex-start;border:2px solid var(--ink);background:var(--card)}
.msg.ai.ahead{border-color:var(--ahead)}
.chat-in{display:flex;gap:8px;padding-block:10px;border-top:2px solid var(--ink);background:var(--paper)}
.chat-in input{flex:1;min-width:0;border:2px solid var(--ink);background:var(--card);padding:9px 10px;font-size:16px;border-radius:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;font-family:var(--f-head);letter-spacing:.06em;text-transform:uppercase;font-size:13px;z-index:40;max-width:calc(100% - 32px)}
.fade-in{animation:fi .25s ease-out}
@keyframes fi{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}

/* v2 */
.seg{display:flex;border:2px solid var(--ink)}

const ST="́";
function A(s){return typeof s==="string"?s.replace(/'/g,ST):s}
function deep(o){if(Array.isArray(o))return o.map(deep);if(o&&typeof o==="object"){const r={};for(const k in o)r[k]=deep(o[k]);return r}return A(o)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function norm(s){return String(s).toLowerCase().replace(/́/g,"").replace(/ё/g,"е").replace(/[.,!?¿¡«»"“”—–:;()]/g," ").replace(/\s+/g," ").trim()}
function bare(s){return String(s).replace(/́/g,"")}
function uid(){return Math.random().toString(36).slice(2,9)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}

function conjI(inf){const s=inf.slice(0,-2);return ["ю","ешь","ет","ем","ете","ют"].map(e=>s+e)}

function conjOVA(inf){const s=inf.slice(0,-("ова"+ST+"ть").length);return ["у"+ST+"ю","у"+ST+"ешь","у"+ST+"ет","у"+ST+"ем","у"+ST+"ете","у"+ST+"ют"].map(e=>s+e)}
const PASTS=Object.assign({},PAST_OVR,PAST2);
function pastOf(inf){const o=PASTS[bare(inf)];if(o)return A(o).split(",");const head=inf.split(" ")[0];
 if(/ться$/.test(head)){const s=head.slice(0,-4);return [s+"лся",s+"лась",s+"лись"]}
 if(/ть$/.test(head)){const s=head.slice(0,-2);return [s+"л",s+"ла",s+"ли"]}return ["","",""]}

 v.forms=forms?(Array.isArray(forms)?forms.map(A):A(forms).split(",")):group==="VA"?conjVA(inf):group==="OVA"?conjOVA(inf):conjI(inf);v.past=pastOf(inf);return v}

 if(g==="oj"){st=m.replace(/о́?й$/,"");const soft=/[кгхжшчщ]$/.test(st);return [m,st+"а"+ST+"я",st+"о"+ST+"е",st+(soft?"и":"ы")+ST+"е"]}
 if(g==="kgh")return [m,st+"ая",st+"ое",st+"ие"];
 if(g==="zhsh")return [m,st+"ая",st+"ее",st+"ие"];

 return [m,st+"ая",st+"ое",st+"ые"]}

 t.pick=sorted.slice(0,3).map(p=>p.id);saveLocal();return t.pick.map(id=>avail.find(p=>p.id===id))}

function fixPrompt(consigna,src,text){return `Sos mi corrector de ruso. Estudio con mi profesora. Hablo castellano (Argentina) y estoy en nivel A2.

LO QUE YA VI
${seenSummary()}

CÓMO CORREGIRME
1. Usá solo gramática y vocabulario de lo que ya vi. Si para arreglar algo hace falta un tema que no vi, marcalo como «ADELANTO» y no lo expliques salvo que te lo pida.
2. Corrección mínima: respetá mis oraciones. Arreglá solo lo que está mal; no reescribas el texto para que suene más nativo.
3. Primero, oración por oración: ✓ si está bien; ✗ si tiene un error, con una pista corta, sin darme la solución.
4. Después, en una sección «EXPLICACIÓN», cada error paso a paso en castellano: qué escribí, qué regla aplica, cómo se aplica, la forma correcta y otro ejemplo con palabras que ya conozco.
5. Decime qué casos usé bien y cuáles mal (nominativo, genitivo, dativo, acusativo, instrumental, preposicional).
6. Marcá el acento (´) en las palabras que corrijas.
7. Al final, mi texto corregido completo.

${consigna?`CONSIGNA${src?" ("+src+")":""}\n${bare(consigna)}\n\n`:""}MI TEXTO
${text}`}
function askPrompt(q){return `Sos mi ayudante de ruso. Estudio con mi profesora. Hablo castellano (Argentina) y estoy en nivel A2.

LO QUE YA VI
${seenSummary()}

CÓMO RESPONDERME
1. Explicá en castellano, paso a paso y con ejemplos en ruso (con acentos ´).
2. Usá solo gramática y vocabulario de lo que ya vi. Si la respuesta necesita algo que no vi, avisame que es un «ADELANTO» antes de explicarlo.
3. Cerrá con 2 o 3 oraciones de práctica para que yo complete, sin las respuestas.

MI DUDA
${q}`}

  main.innerHTML=`<div class="view fade-in"><section class="sec"><div class="big-stat"><span class="n">${rv.ok}</span><span class="t">aciertos de primera · +${rv.ok} puntos</span></div>
  <p class="note">${rv.miss.length?`${rv.miss.length} para seguir repasando. Quedaron guardadas en Difíciles.`:"Ninguna para repasar."}</p>
  ${rv.miss.length?`<div>${rv.miss.map(it=>`<div class="miss"><span class="ru"><b>${esc(qOf(it))}</b>${it.type==="case"?" · "+CASE_ES[it.c]+(it.nm==="p"?" pl.":" sing."):it.type==="verb"?" · "+PRON[it.p]:""}</span><span class="${isRu(answerOf(it))?"ru":""}">${esc(answerOf(it))}</span></div>`).join("")}</div>`:""}
  <div class="row">${rv.miss.length?`<button class="btn red" style="flex:1 1 150px" data-act="rvMiss">Repasar solo estas</button>`:""}<button class="btn" style="flex:1 1 150px" data-act="rvAgain">Otra ronda</button><button class="btn" style="flex:1 1 150px" data-act="rvSetup">Cambiar selección</button></div></section></div>`;return}
 const it=rv.queue[rv.i];if(it.opts===undefined)it.opts=makeOpts(it);
 const ans=answerOf(it),q=qOf(it);const flipMode=!it.opts;
 const src=it.type==="ficha"?"Ficha":it.type==="case"?"Casos":(it.book?esc(bookName(it.book).split(" · ")[0])+" · "+lbl(it.book,it.lesson):"");
 const sub=it.type==="verb"?`<span class="hint">${it.pf?"Futuro":"Presente"} · <b class="ru">${PRON[it.p]}</b></span>`:it.type==="case"?`<span class="hint">${CASE_ES[it.c]} · ${it.nm==="p"?"plural":"singular"}</span>`:it.type==="ficha"?"":`<span class="hint">${rv.dir==="ru"?"¿Qué significa?":"¿Cómo se dice en ruso?"}</span>`;
 let html=`<div class="view fade-in"><section class="sec"><div class="row" style="justify-content:space-between;align-items:center"><span class="counter">${rv.i+1} de ${rv.queue.length}</span><button class="linkbtn" data-act="rvSetup">Terminar</button></div><div class="pbar"><i style="width:${rv.i/rv.queue.length*100}%"></i></div>
 <div class="qcard"><span class="src">${src}</span><span class="q ${isRu(q)?"ru":""} ${q.length>28?"small":""}">${esc(q)}</span>${sub}</div>`;
 if(!flipMode){html+=`<div class="opts">${it.opts.map((o,k)=>{let c="";if(rv.ans!=null){if(norm(o)===norm(ans))c="right";else if(rv.ans===k)c="wrong"}return `<button class="opt ${c} ${isRu(o)?"ru":""}" data-act="rvPick" data-k="${k}" ${rv.ans!=null?"disabled":""}>${esc(o)}${c==="right"?"<span>✓</span>":c==="wrong"?"<span>✗</span>":""}</button>`}).join("")}</div>`;
  html+=rv.ans==null?`<button class="btn block" data-act="rvDunno">No me acuerdo</button>`:`${rv.ans==="nr"?`<p class="note">Respuesta: <b class="${isRu(ans)?"ru":""}">${esc(ans)}</b>. Vuelve más adelante.</p>`:norm(it.opts[rv.ans])!==norm(ans)?`<p class="note">Vuelve más adelante.</p>`:""}<button class="btn red block" data-act="rvNext">Siguiente</button>`}
 else html+=rv.flip?`<div class="qcard" style="border-color:var(--red)"><span class="q small pre ${isRu(ans)?"ru":""}">${esc(ans)}</span></div><div class="row"><button class="btn" style="flex:1" data-act="rvSelf" data-ok="0">No me acordé</button><button class="btn red" style="flex:1" data-act="rvSelf" data-ok="1">Me acordé</button></div>`:`<button class="btn red block" data-act="rvFlip">Ver la respuesta</button>`;
 main.innerHTML=html+`</section></div>`}
function rvResult(ok){const it=rv.queue[rv.i];
 if(ok){if(it.tries===0){rv.ok++;addXP(1);if(rv.fromWeak&&S.weak[it.id])delete S.weak[it.id];save()}}
 else{if(it.type!=="ficha"){const c=Object.assign({},it);delete c.opts;delete c.tries;S.weak[it.id]=c;save()}
  if(!rv.miss.some(m=>m.id===it.id))rv.miss.push(it);
  if(it.tries<2){const copy=Object.assign({},it,{tries:it.tries+1});delete copy.opts;rv.queue.splice(Math.min(rv.queue.length,rv.i+4),0,copy)}}}
function rvNext(){rv.i++;rv.ans=null;rv.flip=false;if(rv.i>=rv.queue.length)rv.mode="done";rReview();main.scrollTop=0}

/* ===== Nueva clase ===== */
function openNewEntry(){const opts=BK.map(b=>b.lessons.map(n=>`<option value="${b.id}:${n}">${esc(bare(b.name))} · ${lbl(b.id,n)}</option>`).join("")).join("");
 overlay("Nueva clase",`<form id="eForm" class="sec" style="gap:16px">
 <div class="field"><label for="eDate">Fecha</label><input type="date" id="eDate" value="${today()}" required></div>
 <div class="field"><label for="eLes">¿Qué vieron?</label><select id="eLes">${opts}</select></div>
 <div class="field"><label for="eTitle">Tema</label><input id="eTitle" placeholder="Ej.: Глаголы с чередованием"></div>
 <div class="field"><label for="eNotes">Notas</label><textarea id="eNotes" rows="4" placeholder="Qué dijo la profe, tarea, dudas para la próxima."></textarea></div>
 <div class="field"><label for="eMat">Material de la profe (nombre)</label><input id="eMat" placeholder="Ej.: Fotocopia de verbos"></div>
 <div id="eTopics"></div>
 <p class="note">Para sumar los verbos, adjetivos o palabras de ese material, usá «Sumar desde tu material» en Consulta.</p>
 <button class="btn red block" type="submit">Guardar clase</button></form>`);
 const sel=document.getElementById("eLes");const nw=nowL("a2");sel.value=nw?"a2:"+nw:"a2:22";
 const drawT=()=>{const [b,n]=sel.value.split(":");const l=getL(b,+n);document.getElementById("eTopics").innerHTML=l&&l.g.length?`<p class="flabel">Marcá los temas que vieron</p><div class="checks">${l.g.map((g,i)=>`<label><input type="checkbox" value="${esc(g)}" id="et${i}"><span class="ru">${esc(g)}</span></label>`).join("")}</div>`:""};sel.addEventListener("change",drawT);drawT();
 document.getElementById("eForm").addEventListener("submit",ev=>{ev.preventDefault();const [b,n]=sel.value.split(":");
  S.entries.push({id:uid(),date:val("eDate")||today(),book:b,lesson:+n,title:val("eTitle")||bare(getL(b,+n).text||lbl(b,+n)),notes:val("eNotes"),material:val("eMat")?[val("eMat")]:[],topics:[...ov.querySelectorAll("#eTopics input:checked")].map(x=>x.value)});
  save();closeOv();toast("Clase guardada")})}

/* ---------- copia de seguridad ---------- */
function openRestore(){overlay("Restaurar copia",`<p class="note">Pegá la copia que guardaste. Reemplaza todo lo que hay ahora en esta app.</p><textarea id="bkT" class="wtext" rows="10" placeholder="Pegá acá la copia"></textarea><button class="btn red block" data-act="bkDo">Restaurar</button>`)}
function doRestore(){let o;try{o=JSON.parse(document.getElementById("bkT").value.trim())}catch(e){toast("No es una copia válida");return}
 if(!o||o.app!=="mateshka"||!o.S||!o.S.prog){toast("No es una copia de Mateshka");return}
 S=o.S;["entries","fichas","writings"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});["weak","errors","days"].forEach(k=>{if(!S[k])S[k]={}});if(!S.extra)S.extra={v:[],a:[]};
 for(const id in (o.PH||{})){PH[id]=o.PH[id];try{localStorage.setItem(KEY+"-ph-"+id,o.PH[id])}catch(e){}}
 save();backStack=[];ov.innerHTML="";go("home");toast("Copia restaurada")}
/* ---------- archivos ---------- */
function readImg(file,max,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};img.onerror=()=>cb(null);img.src=r.result};r.readAsDataURL(file)}
document.getElementById("fileFicha").addEventListener("change",e=>{const f=e.target.files[0];e.target.value="";if(!f)return;readImg(f,900,d=>{ficDraft.photo=d;const p=document.getElementById("fPrev");if(p)p.innerHTML=d?`<img src="${d}" alt="" style="max-height:160px;border:2px solid var(--ink)">`:""})});

/* ---------- eventos ---------- */
function keepScroll(fn){const b=document.getElementById("ovBody");const k=b?b.scrollTop:0;fn();const n=document.getElementById("ovBody");if(n)n.scrollTop=k}
function saveWriting(pid){const t=document.getElementById("wText").value.trim();if(!t){toast("Escribí algo primero");return}
 let w=writingFor(pid);if(!w){w={id:uid(),date:today(),pid,text:t,corr:"",tags:[],kind:"reto"};S.writings.push(w);addXP(15);const d=day();d.done[pid]=true;const picks=todayPicks().map(p=>p.id);if(!d.bonus&&picks.every(id=>d.done[id])){d.bonus=true;addXP(20);toast("Reto completo: +20 de bonus")}else toast("Guardada: +15")}else{w.text=t;toast("Cambios guardados")}
 if(S.writings.length>400)S.writings=S.writings.slice(-400);save();keepScroll(()=>openWrite(pid))}
function saveCorr(pid){const w=writingFor(pid);const c=document.getElementById("wCorr").value.trim();if(!w)return;if(!c){toast("Pegá la corrección primero");return}
 const first=!w.corr;const old=new Set(w.tags||[]);w.corr=c;w.tags=[...wtags];wtags.forEach(t=>{if(!old.has(t))S.errors[t]=(S.errors[t]||0)+1});if(first)addXP(10);save();toast(first?"Corrección guardada: +10":"Corrección actualizada");closeOv()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act],[data-tab]");if(!b)return;
 if(b.dataset.tab){backStack=[];if(ov.firstChild)ov.innerHTML="";go(b.dataset.tab);return}
 const a=b.dataset.act,d=b.dataset;
 switch(a){
  case "close":closeOv();break;
  case "bkCopy":{const ph={};S.fichas.forEach(f=>{if(PH[f.id])ph[f.id]=PH[f.id]});copyText(JSON.stringify({app:"mateshka",v:3,date:today(),S,PH:ph}),"Copia copiada: pegala en Notas o WhatsApp");break}
  case "bkOpen":openRestore();break;
  case "bkDo":doRestore();break;
  case "reto":backStack=[];{const p=todayPicks();const nx=p.find(x=>!writingFor(x.id))||p[0];if(nx)openWrite(nx.id)}break;
  case "moreWrite":openMore();break;
  case "write":if(ov.firstChild&&curOv){push(curOv)}openWrite(d.id);break;
  case "wSave":saveWriting(d.id);break;
  case "copyFix":{const p=PROMPTS_.find(x=>x.id===d.id);const w=writingFor(d.id);const t=document.getElementById("wText").value.trim()||(w&&w.text)||"";copyText(fixPrompt(p.ru,bare(bookName(p.b))+", "+lbl(p.b,p.l)+", p. "+p.p,t));break}
  case "wtag":{const t=d.t;if(wtags.has(t))wtags.delete(t);else wtags.add(t);b.setAttribute("aria-pressed",wtags.has(t));break}
  case "wCorrSave":saveCorr(d.id);break;
  case "tool":openTool(d.k);break;
  case "tCopy":{const t=val("tText");if(!t){toast("Escribí algo primero");break}copyText(d.k==="q"?askPrompt(t):fixPrompt(val("tCons"),"",t));break}
  case "tSave":{const t=val("tText");if(!t){toast("Escribí algo primero");break}const c=val("tAns");S.writings.push({id:uid(),date:today(),pid:null,text:t,corr:c,tags:[...wtags],kind:d.k,title:val("tCons")});wtags.forEach(x=>{S.errors[x]=(S.errors[x]||0)+1});if(d.k==="ex"&&c)addXP(10);save();toast("Guardado");closeOv();break}
  case "tFicha":{const t=val("tText"),c=val("tAns");if(!c){toast("Pegá la respuesta primero");break}const id=uid();S.fichas.unshift({id,title:t.slice(0,60),front:t,back:c,pinned:true,photo:false,book:null,lesson:0});S.writings.push({id:uid(),date:today(),pid:null,text:t,corr:c,tags:[],kind:"q"});save();toast("Guardada como ficha");closeOv();break}
  case "history":openHistory();break;
  case "focus":fz.hide=false;openFocus(d.id);break;
  case "fzClose":fz.id=null;ov.innerHTML="";render();break;
  case "fzHide":fz.hide=!fz.hide;openFocus(fz.id);break;
  case "fzGo":{const list=S.fichas.slice().sort((x,y)=>(y.pinned?1:0)-(x.pinned?1:0));const i=list.findIndex(f=>f.id===fz.id)+(+d.d);if(list[i]){fz.hide=fz.hide;openFocus(list[i].id)}break}
  case "fzEdit":push(()=>openFocus(fz.id));openFicha(fz.id);break;
  case "newFicha":fz.id=null;openFicha(null);break;
  case "editFicha":fz.id=null;openFicha(d.id);break;
  case "pickFicha":document.getElementById("fileFicha").click();break;
  case "delFicha":{if(b.dataset.sure){S.fichas=S.fichas.filter(x=>x.id!==d.id);try{localStorage.removeItem(KEY+"-ph-"+d.id)}catch(er){}if(cloud.db&&cloud.uid)cloud.db.doc("data/users/"+cloud.uid+"/ph-"+d.id).delete().catch(()=>{});save();backStack=[];fz.id=null;ov.innerHTML="";render();toast("Ficha borrada")}else{b.dataset.sure="1";b.textContent="Tocá de nuevo para borrar";b.classList.add("red")}break}
  case "pin":{const f=S.fichas.find(x=>x.id===d.id);f.pinned=!f.pinned;save();rReview();break}
  case "book":openBook(d.b);break;
  case "lesson":if(ov.firstChild&&curOv){push(curOv)}openLesson(d.b||"a1",+d.n,"res");break;
  case "ltab":keepScroll(()=>openLesson(d.b,+d.n,d.t));break;
  case "prog":{const B=BK.find(x=>x.id===d.b);const ls=B.lessons;let i=ls.indexOf(prog(d.b))+(+d.d);i=Math.max(0,Math.min(ls.length-1,i));S.prog[d.b]=ls[i];rv.sel=null;save();render();break}
  case "setProg":S.prog[d.b]=+d.n;rv.sel=null;save();backStack=[];ov.innerHTML="";render();toast("Marcado como visto hasta "+lbl(d.b,+d.n));break;
  case "reviewLesson":rv=Object.assign(rv,{mode:"setup",kind:"vocab",sel:new Set([lkey(d.b,+d.n)])});backStack=[];ov.innerHTML="";go("review");startReview();break;
  case "askAbout":{const l=getL(d.b,+d.n);openTool("q","Explicame con más detalle el tema «"+bare(l.text||lbl(d.b,+d.n))+"» ("+bare(bookName(d.b))+", "+lbl(d.b,+d.n)+").");break}
  case "newEntry":openNewEntry();break;
  case "refTab":refTab=d.t;openVerb=null;rRef();break;
  case "case":caseSel=d.c;rRef();break;
  case "cnum":caseNum=d.v;rRef();break;
  case "verb":{const k=main.scrollTop;openVerb=openVerb===d.id?null:d.id;const hero=document.querySelector(".ov .les-hero");if(ov.firstChild&&hero){const btn=ov.querySelector('[data-act="ltab"][aria-pressed="true"]');keepScroll(()=>openLesson(btn.dataset.b,+btn.dataset.n,"ver"))}else{rRef();main.scrollTop=k}break}
  case "import":openImport(d.k);break;
  case "impK":{const t=val("impT");openImport(d.k);document.getElementById("impT").value=t;break}
  case "impCopy":copyText(importPrompt(impK));break;
  case "impSave":{const rows=parseImport();if(!rows.length){toast("No encontré líneas con el formato «ruso | castellano»");break}const [bk,ln]=val("impL").split(":");const src=val("impSrc")||"Material de la profe";let n=0;
   rows.forEach(r=>{if(impK==="v"){const forms=r[2]?r[2].split(/\s*,\s*/):null;const id="v:"+bare(r[0]);if(!S.extra.v.some(x=>x.id===id&&x.src===src)){S.extra.v.push({id,inf:r[0],es:r[1],book:bk,lesson:+ln,group:forms&&forms.length===6?(VERBS.find(v=>v.id===id)||{group:"I"}).group:"I",forms:forms&&forms.length===6?forms:null,src});n++}}
    else if(impK==="a"){const id="a:"+bare(r[0]);if(!S.extra.a.some(x=>x.id===id&&x.src===src)){S.extra.a.push({id,m:r[0],es:r[1],book:bk,lesson:+ln,src});n++}}
    else{if(!S.extra.w)S.extra.w=[];const id="w:"+bare(r[0]);if(!S.extra.w.some(x=>x.id===id)){S.extra.w.push({id,ru:r[0],es:r[1],book:bk,lesson:+ln,src});n++}}});
   save();toast(n+" sumados");closeOv();break}
  case "rvKind":rv.kind=d.k;rReview();break;
  case "rvL":{const s=selL();if(s.has(d.k))s.delete(d.k);else s.add(d.k);rReview();break}
  case "rvAll":rv.sel=null;selL();rReview();break;
  case "rvNone":rv.sel=new Set();rReview();break;
  case "rvBook":rv.sel=new Set([...allSeenKeys()].filter(k=>k.startsWith(d.b+":")));rReview();break;
  case "rvDir":rv.dir=d.d;rReview();break;
  case "rvOpt":rv.nOpt=+d.o;rReview();break;
  case "rvCount":rv.count=+d.c;rReview();break;
  case "rvStart":startReview();break;
  case "rvPick":{const it=rv.queue[rv.i];const k=+d.k;rv.ans=k;rvResult(norm(it.opts[k])===norm(answerOf(it)));rReview();break}
  case "rvDunno":rv.ans="nr";rvResult(false);rReview();break;
  case "rvNext":rvNext();break;
  case "rvFlip":rv.flip=true;rReview();break;
  case "rvSelf":rvResult(d.ok==="1");rvNext();break;
  case "rvMiss":{const ms=rv.miss.map(m=>{const c=Object.assign({},m,{tries:0});delete c.opts;return c});rv.queue=shuffle(ms);rv.i=0;rv.ans=null;rv.ok=0;rv.miss=[];rv.mode="run";rReview();break}
  case "rvAgain":startReview();break;
  case "rvSetup":rv.mode="setup";rReview();break;
  case "quickWeak":rv.kind="weak";go("review");startReview();break;
 }});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ov.firstChild){if(fz.id){fz.id=null;ov.innerHTML="";render()}else closeOv()}});
setCloud("local");go("home");initCloud();

})();
</script>

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
